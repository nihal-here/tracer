name: Trace CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Node (for basedpyright)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Compile Python Code
        run: |
          python -m compileall app tests evals

      - name: Type Check (BasedPyright)
        run: |
          npx -y basedpyright app tests evals --outputjson > pyright.json || true
          npx -y basedpyright app tests evals || true
          node -e "if (require('./pyright.json').summary.errorCount > 0) process.exit(1);"

      - name: Run Tests (Offline)
        env:
          # Dummy values for CI to bypass missing credentials in offline tests
          GEMINI_API_KEY: "dummy-key-for-ci-only"
          GITHUB_TOKEN: "dummy-token-for-ci-only"
        run: |
          pytest tests/
